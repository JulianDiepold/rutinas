<!DOCTYPE html>
<html lang="es">
<head>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mi rutina</title>
<style>
:root{--bg:#FBF1E8;--card:#fff;--tx:#2B1A0F;--tx2:#85604A;--acc:#C2410C;--onacc:#fff;--accbg:#FFE6D2;--ok:#14805A;--okbg:#DDF4EA;--nt:#1C5CAB;--ntbg:#E2EEFA;--bad:#B3261E;--bar:#F3DCCB}
@media (prefers-color-scheme:dark){:root{--bg:#1E140D;--card:#2B1D13;--tx:#FBEFE6;--tx2:#C9A58E;--acc:#FF9A5C;--onacc:#2B1204;--accbg:#4A2A14;--ok:#6FE0B0;--okbg:#173A2D;--nt:#9EC5F4;--ntbg:#0D2A4D;--bad:#FF9C95;--bar:#4A3626}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.ph{max-width:480px;margin:0 auto;padding:22px 14px 170px}
h1{font-size:32px;line-height:1.05;letter-spacing:-.025em;font-weight:700;margin:0}
.meta{font-size:13px;color:var(--tx2);margin:3px 0 0}
button,input,textarea{font:inherit;color:inherit}
.wks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0 0}
.wk{padding:7px 4px;border-radius:12px;border:0;background:var(--card);color:var(--tx2);font-size:13px;font-weight:600;line-height:1.25;text-align:center;cursor:pointer}
.wk small{display:block;font-size:11px;font-weight:400}
.wk.on{background:var(--accbg);color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.ok:disabled{cursor:default;opacity:.6}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin:10px 0 0}
.chip{min-height:46px;padding:10px 12px;font-size:14px;font-weight:500;line-height:1.2;text-align:center;border-radius:14px;border:0;background:var(--card);color:var(--tx2);cursor:pointer}
.chip.on{background:var(--acc);color:var(--onacc)}
.card{background:var(--card);border-radius:22px;padding:16px;margin-top:12px;border:2px solid transparent}
.card.fin{border-color:var(--ok)}
.eh{display:flex;gap:12px;align-items:flex-start}
.n{flex:none;width:30px;height:30px;border-radius:10px;background:var(--accbg);color:var(--acc);font-weight:700;font-size:14px;display:grid;place-items:center}
.card.fin .n{background:var(--okbg);color:var(--ok)}
.t{margin:0;font-size:18px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;background:var(--ntbg);color:var(--nt);border-radius:12px;padding:9px 11px;margin-top:12px}
.prev{margin-top:12px}
.pl{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pc{font-size:12px;line-height:1.3;background:var(--bg);color:var(--tx);border-radius:10px;padding:5px 9px}
.pc b{font-weight:600}
.pc span{color:var(--tx2)}
.pobs{margin:8px 0 0;font-size:12px;line-height:1.4;color:var(--tx2)}
.row{display:grid;grid-template-columns:44px 1fr 1fr 1fr 46px;gap:6px;align-items:center;margin-top:6px}
.row.hd{font-size:11px;color:var(--tx2);text-align:center;margin-top:14px}
.row .l{font-size:13px;color:var(--tx2);text-align:center;line-height:1.15}
.row .l small{display:block;font-size:11px;color:var(--acc);font-weight:600}
.row .l small i{display:block;font-style:normal;color:var(--tx2);font-weight:400}
.row input{width:100%;min-width:0;height:44px;font-size:16px;font-weight:500;text-align:center;border:0;border-radius:12px;background:var(--bg)}
.row input::placeholder{color:var(--tx2);opacity:.5;font-weight:400}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ok{height:44px;width:46px;border-radius:12px;border:0;background:var(--bg);color:var(--tx2);font-size:18px;cursor:pointer}
.ok.done{background:var(--ok);color:var(--card)}
.vb{display:flex;gap:6px;flex-wrap:wrap}
.vr{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--bg)}
.vr b{font-size:14px;font-weight:600;line-height:1.2}
.vr i{font-style:normal;color:var(--acc);margin-right:6px}
.sm{white-space:nowrap;flex:none;font-size:13px;height:34px;padding:0 13px;border-radius:999px;border:0;background:var(--accbg);color:var(--acc);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
#sleep{border:0;border-radius:12px;background:var(--bg);font-size:16px}
textarea{border:0;border-radius:12px;background:var(--bg);padding:9px 11px}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.main{width:100%;margin-top:14px;height:48px;border-radius:14px;border:0;background:var(--acc);color:var(--onacc);font-weight:600;font-size:16px;cursor:pointer}
a{color:var(--acc)}
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 64px);z-index:5;max-width:calc(100% - 16px);background:var(--acc);color:var(--onacc);border-radius:999px;padding:8px 10px 8px 14px;font-weight:600;display:flex;gap:10px;align-items:center;white-space:nowrap;box-shadow:0 10px 28px rgba(43,26,15,.3)}
#rest:empty{display:none}
#rest .bl{display:flex;flex-direction:column;gap:3px;min-width:52px}
#rest .bl b{display:block;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
#rest .bl.e b{font-size:18px;font-weight:500}
#rest .bl small{font-size:10px;font-weight:500;opacity:.85;letter-spacing:.02em}
#rest .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.3)}
#rest button{border:0;border-radius:999px;height:34px;padding:0 10px;background:rgba(255,255,255,.2);color:inherit;font-size:13px;font-weight:600;cursor:pointer}
#rest a{color:var(--onacc);opacity:.85;font-weight:500;font-size:14px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="ph" id="app"><p class="meta">Cargando tu rutina… la primera vez puede tardar unos segundos.</p></div>

<script>
// URL de la aplicación web de Apps Script (la que termina en /exec, sin /u/N/)
var API = 'https://script.google.com/macros/s/AKfycbymJTRn0wWMrBHstnMuKD2dmnK-VhWw9LN15KeW1Z9XHEHRApj2JiDEMJzmcctowN06/exec';

var qs = new URLSearchParams(location.search);
var ID = qs.get('id') || '';
var TOKEN = qs.get('t') || '';
var D = [], day = 0, S = {}, O = {}, T = null, left = 0;
// Semanas: SEMS = últimas 4 (la más nueva primero; en pantalla se muestran de la más vieja a la más nueva), SEL = la que se está viendo. RO queda siempre en false (todas se pueden editar).
var SEMS = [], SEL = '', RO = false, W = {}, ST = {}, REQ = 0, DBG = null;

function $(i){ return document.getElementById(i); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function key(d,e,s){ return d + '_' + e + '_' + s; }
function cap(s){ s = String(s || '').toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
function fmt(n){ return Math.floor(n/60) + ':' + ('0' + (n % 60)).slice(-2); }
function restSec(t){ return 180; }   // descanso fijo: 3 minutos
function msg(t, ok){ var m = $('msg'); if (!m) return; m.style.color = ok ? 'var(--ok)' : 'var(--bad)'; m.textContent = t || ''; }

// ----- Comunicación con Apps Script -----
// Lectura: GET. Escritura: POST con text/plain (evita el preflight de CORS, que Apps Script no soporta).
function esperar(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
// Si el navegador sabe que no hay red (p. ej. mientras el celu cambia de antena o de WiFi a datos), espera a que vuelva (máx. 20 s).
function esperarRed(){
  if (navigator.onLine !== false) return Promise.resolve();
  return new Promise(function(res){
    var f = function(){ window.removeEventListener('online', f); res(); };
    window.addEventListener('online', f); setTimeout(f, 20000);
  });
}
// Repite el pedido hasta "max" veces con pausas crecientes (1 s, 2 s, 3 s…). Un cambio de red dura unos segundos: así se lo "salta".
function conReintentos(fn, max){
  var i = 0;
  function probar(){
    return esperarRed().then(fn).catch(function(e){
      if (e && e.message === 'Link inválido') throw e;
      if (++i >= max) throw e;
      return esperar(1000 * i).then(probar);
    });
  }
  return probar();
}

// Guarda la página en el celular para que abra aunque la red esté cortada o cambiando (ver sw.js).
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });

function leer(sem){
  var t0 = performance.now();
  var url = API + '?action=rutina&id=' + encodeURIComponent(ID) + '&t=' + encodeURIComponent(TOKEN) + (sem ? '&semana=' + encodeURIComponent(sem) : '');
  return conReintentos(function(){
    var ctl = new AbortController(), to = setTimeout(function(){ ctl.abort(); }, 20000);
    return fetch(url, { signal: ctl.signal })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var j = JSON.parse(t);
        if (!j.ok) throw new Error(j.error || 'Error');
        DBG = { ms: Math.round(performance.now() - t0), kb: Math.round(t.length / 102.4) / 10, srv: j.data && j.data.t };
        mostrarDbg();
        return j.data;
      })
      .finally(function(){ clearTimeout(to); });
  }, 5);
}
// Las escrituras son "poner este valor en esta celda": repetirlas no duplica nada, así que es seguro reintentarlas.
// Los reintentos largos los maneja la cola de pendientes (vaciar), por eso acá son pocos.
function enviar(body, sem){
  body.id = ID; body.t = TOKEN; body.semana = sem || SEL;
  var datos = JSON.stringify(body);
  return conReintentos(function(){
    var ctl = new AbortController(), to = setTimeout(function(){ ctl.abort(); }, 20000);
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: datos, signal: ctl.signal })
      .then(function(r){ return r.json(); })
      .then(function(j){ if (!j.ok) throw new Error(j.error || 'Error'); return j; })
      .finally(function(){ clearTimeout(to); });
  }, 2);
}

// La fuente se pide recién cuando la rutina ya se ve, para que no compita con los datos por la conexión.
function cargarFuente(){
  if (window.__fuente) return; window.__fuente = 1;
  var l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap';
  document.head.appendChild(l);
}

// Con ?debug=1 al final del link se muestra cuánto tardó cada parte (sirve para saber dónde está la demora).
function mostrarDbg(){
  if (!qs.get('debug') || !DBG) return;
  var el = $('dbg');
  if (!el) {
    el = document.createElement('div'); el.id = 'dbg';
    el.style.cssText = 'position:fixed;left:8px;top:8px;z-index:9;background:rgba(0,0,0,.8);color:#fff;font:12px/1.35 monospace;padding:6px 9px;border-radius:8px;max-width:92%';
    document.body.appendChild(el);
  }
  el.textContent = 'total ' + (DBG.ms / 1000).toFixed(1) + ' s · servidor ' + (DBG.srv ? (DBG.srv.ms / 1000).toFixed(1) + ' s (' + DBG.srv.via + ')' : '?') + ' · ' + DBG.kb + ' KB';
}

function falloCarga(e){
  var t = (e && e.message === 'Link inválido')
    ? 'Este link no es válido. Pedile a tu entrenador que te lo envíe de nuevo.'
    : 'No pude abrir tu rutina. Revisá tu conexión e intentá de nuevo.';
  $('app').innerHTML = '<p class="meta">' + t + '</p>' + ((e && e.message === 'Link inválido') ? '' : '<button class="main" style="margin-top:14px" onclick="location.reload()">Reintentar</button>');
}

// Muestra al instante la última rutina guardada en este dispositivo y la actualiza en segundo plano.
var CK = 'rutina_' + ID, touched = false, shown = false;
function guardarCache(r){ try { localStorage.setItem(CK, JSON.stringify(r)); } catch(e){} }
function leerCache(){ try { return JSON.parse(localStorage.getItem(CK)); } catch(e){ return null; } }

// ===== Almacenamiento local: cola de pendientes + borradores =====
// Todo cambio se guarda primero en el celular (síncrono) y después se intenta enviar a la planilla.
// OUT = cambios que todavía no llegaron a la planilla. DR = valores escritos sin tocar ✓ (borradores).
var OK_ = 'out_' + ID, DK_ = 'dr_' + ID, OUT = {}, DR = {}, flushing = false, dirty = false, RT = null, DT = null;
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)) || {}; } catch(e){ return {}; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
OUT = lsGet(OK_); DR = lsGet(DK_);

// Aplica un cambio pendiente sobre los datos de una semana (en memoria)
function aplicar(r, b){
  var d = r && r.dias && r.dias[b.d]; if (!d) return;
  if (b.action === 'serie') {
    var x = d.ejercicios[b.e], s = x && x.series[b.s];
    if (s) { s.hoy.reps = b.reps; s.hoy.peso = b.peso; s.hoy.rir = b.rir; }
  }
  else if (b.action === 'obs') { if (d.ejercicios[b.e]) d.ejercicios[b.e].obsHoy = b.texto; }
  else if (b.action === 'sueno') d.sueno.hoy = b.horas + 'h';
}
function aplicarPend(r){
  if (!r) return;
  Object.keys(OUT).forEach(function(k){ if (OUT[k].sem === r.semana) aplicar(r, OUT[k].body); });
}

function encolar(clave, body, sem, demora){
  OUT[clave] = { body: body, sem: sem, ts: Date.now() };
  lsSet(OK_, OUT);
  if (W[sem]) { aplicar(W[sem], body); if (W[sem].actual !== false) guardarCache(W[sem]); }
  estadoPend();
  clearTimeout(DT); DT = setTimeout(vaciar, demora || 0);
}

function vaciar(){
  if (flushing) { dirty = true; return; }
  clearTimeout(RT);
  pasada(Object.keys(OUT), 0);
}
function pasada(ks, i){
  if (i === 0) {
    if (!ks.length) { estadoPend(); return; }
    if (navigator.onLine === false) { estadoPend(); RT = setTimeout(vaciar, 15000); return; }
    flushing = true; dirty = false;
  }
  if (i >= ks.length) {
    flushing = false; estadoPend();
    if (dirty) vaciar();                                                  // hubo cambios nuevos mientras se enviaba
    else if (Object.keys(OUT).length) RT = setTimeout(vaciar, 15000);     // quedó algo: reintenta en 15 s
    return;
  }
  var k = ks[i], it = OUT[k];
  if (!it) { pasada(ks, i + 1); return; }
  var ts = it.ts;
  enviar(it.body, it.sem).then(function(){
    if (OUT[k] && OUT[k].ts === ts) { delete OUT[k]; lsSet(OK_, OUT); estadoPend(); }   // si el alumno lo cambió mientras se enviaba, queda para la próxima vuelta
    pasada(ks, i + 1);
  }).catch(function(e){
    if (e && e.message === 'Link inválido') { flushing = false; return; }
    pasada(ks, i + 1);
  });
}

function estadoPend(){
  var p = $('pend'); if (!p) return;
  var n = Object.keys(OUT).length;
  p.style.color = 'var(--tx2)';
  p.textContent = n ? '⏳ ' + n + ' cambio' + (n > 1 ? 's' : '') + ' guardado' + (n > 1 ? 's' : '') + ' en tu celular, enviando a la planilla…' : '';
}

window.addEventListener('online', function(){ vaciar(); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden) vaciar(); });

if (!ID || !TOKEN) { falloCarga({ message: 'Link inválido' }); }
else {
  var cached = leerCache();
  if (cached && cached.dias && cached.dias.length) { init(cached); shown = true; }
  var slowT = setTimeout(function(){ if (!shown) $('app').innerHTML = '<p class="meta">Sigue cargando… tu conexión parece lenta, un momento más.</p>'; }, 8000);
  leer().then(function(r){
    clearTimeout(slowT);
    aplicarPend(r);     // superpone lo que aún no llegó a la planilla
    guardarCache(r);
    W[r.semana] = r;
    if (!shown || !touched) { init(r); shown = true; }
  }).catch(function(e){
    clearTimeout(slowT);
    if (e && e.message === 'Link inválido') { try { localStorage.removeItem(CK); } catch(x){} falloCarga(e); }
    else if (!shown) falloCarga(e);
  });
}

function init(r, restore){
  aplicarPend(r);
  D = r.dias || [];
  if (r.actual !== false || !SEMS.length) SEMS = r.semanas || [r.semana];   // la lista de semanas la define la respuesta de la semana actual
  SEL = r.semana; RO = false; W[SEL] = r;   // las 4 semanas se pueden cargar y modificar
  if (day >= D.length) day = 0;
  var st = restore && ST[SEL];
  if (st) { S = st.S; O = st.O; }   // al volver a una semana, se conserva lo que ya se había cargado
  else {
    S = {}; O = {};
    D.forEach(function(d, di){ d.ejercicios.forEach(function(x, ei){ O[di + '_' + ei] = x.obsHoy || ''; x.series.forEach(function(s, si){
      if (s.hoy.reps !== '' && s.hoy.peso !== '') S[key(di,ei,si)] = { r: s.hoy.reps, k: s.hoy.peso, i: s.hoy.rir, d: true };
    }); }); });
    // Borradores: lo escrito sin tocar ✓ se recupera al reabrir
    var dr = DR[SEL] || {};
    Object.keys(dr).forEach(function(k){
      if (!(S[k] && S[k].d)) S[k] = { r: dr[k].r, k: dr[k].k, i: dr[k].i, d: false };
    });
  }
  $('app').innerHTML =
    '<h1>Tu rutina</h1><p class="meta" id="sub"></p>' +
    '<div class="wks" id="wks"></div><div id="ro"></div>' +
    '<div class="tabs" id="tabs"></div>' +
    '<div class="card" style="display:flex;align-items:center;gap:8px"><span style="font-size:13px;flex:1">Horas de sueño previas</span>' +
    '<input id="sleep" type="text" inputmode="decimal" placeholder="7" style="width:64px;height:36px;text-align:center" onchange="saveSleep(this.value)"></div>' +
    '<div id="rest"></div>' +
    '<div id="list"></div>' +
    '<div class="card"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span id="plab" style="color:var(--tx2)"></span><span id="ppct"></span></div>' +
    '<div class="bar"><i id="pb"></i></div><button class="main" id="fin" onclick="finish()">Terminar entrenamiento</button>' +
    '<p id="pend" class="meta" style="margin-top:8px"></p>' +
    '<p id="msg" style="font-size:13px;margin:8px 0 0;min-height:18px"></p></div>';
  render();
  setTimeout(cargarFuente, 600);
  estadoPend(); vaciar();
}

function render(){
  var mm = /^S(\d+)\s*-\s*(\d+\/\d+)/.exec(SEL || '');
  $('sub').textContent = mm ? 'Semana ' + mm[1] + ' · desde el ' + mm[2] + (RO ? ' · solo lectura' : '') : (SEL || '');
  $('ro').innerHTML = RO ? '<div class="note"><span>Estás viendo una semana anterior, solo para consultar. Para cargar tus series volvé a la semana actual.</span></div>' : '';
  $('fin').style.display = RO ? 'none' : '';
  $('sleep').readOnly = RO;
  renderSemanas();
  var tabs = '';
  D.forEach(function(x, i){ tabs += '<button class="chip' + (i == day ? ' on' : '') + '" onclick="go(' + i + ')">' + esc(cap(x.titulo)) + '</button>'; });
  $('tabs').innerHTML = tabs;
  var sl = String(D[day].sueno.hoy || '').replace(/[^\d.,]/g, '');
  if (document.activeElement !== $('sleep')) $('sleep').value = sl;

  var h = '';
  D[day].ejercicios.forEach(function(x, ei){
    h += '<div class="card' + (exDone(ei) ? ' fin' : '') + '"><div class="eh"><span class="n">' + (ei+1) + '</span><div><p class="t">' + esc(x.nombre) + '</p>';
    h += '<p class="meta">' + x.series.length + ' series · ' + esc(x.reps) + ' reps · RIR ' + esc(x.rir) + ' · descanso ' + esc(String(x.descanso).toLowerCase()) + '</p></div></div>';
    if (x.nota) h += '<div class="note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>' + esc(x.nota) + '</span></div>';
    var prev = x.series.map(function(s, si){
      if (s.ant.reps === '') return '';
      var dd = String(s.ant.des || '').trim(); if (/^\d+$/.test(dd)) dd += ' min';
      return '<span class="pc"><b>' + (si+1) + 'ª</b> ' + esc(s.ant.reps) + (s.ant.peso !== '' ? ' × ' + esc(s.ant.peso) + ' kg' : '') + (s.ant.rir !== '' ? ' <span>· RIR ' + esc(s.ant.rir) + '</span>' : '') + (dd ? ' <span>· ' + esc(dd) + '</span>' : '') + '</span>';
    }).join('');
    if (prev || x.antObs) h += '<div class="prev"><p class="pl">Semana pasada</p>' + (prev ? '<div class="chips">' + prev + '</div>' : '') + (x.antObs ? '<p class="pobs">Tu comentario: ' + esc(x.antObs) + '</p>' : '') + '</div>';
    h += '<div class="row hd"><span>serie</span><span>reps</span><span>kg</span><span>RIR</span><span></span></div>';
    x.series.forEach(function(s, si){
      var k = key(day, ei, si), v = S[k] || {};
      var ob = s.obj && s.obj.reps ? '<small>' + esc(s.obj.reps) + '</small>' : '';
      h += '<div class="row"><span class="l">' + (si+1) + ob + '</span>' +
        '<input inputmode="numeric" pattern="[0-9]*" placeholder="' + esc(s.ant.reps !== '' ? s.ant.reps : 'reps') + '" value="' + esc(v.r == null ? '' : v.r) + '" oninput="setv(\'' + k + '\',\'r\',this.value)" aria-label="Repeticiones">' +
        '<input inputmode="decimal" placeholder="' + esc(s.ant.peso !== '' ? s.ant.peso : 'kg') + '" value="' + esc(v.k == null ? '' : v.k) + '" oninput="setv(\'' + k + '\',\'k\',this.value)" aria-label="Kilos">' +
        '<input inputmode="decimal" placeholder="RIR" value="' + esc(v.i == null ? '' : v.i) + '" oninput="setv(\'' + k + '\',\'i\',this.value)" aria-label="RIR">' +
        '<button class="ok' + (v.d ? ' done' : '') + '" onclick="tog(' + ei + ',' + si + ')" aria-label="Guardar serie">✓</button></div>';
    });
    var vs = x.vids && x.vids.length ? x.vids : (x.videos || []).map(function(u, i){ return { u: u, t: 'Referencia ' + (i + 1) }; });
    var nm = x.nombres && x.nombres.length > 1 ? x.nombres : null;
    var btn = function(v){ return '<a class="sm" href="' + esc(v.u) + '" target="_blank" rel="noopener">▶ ' + esc(v.t || 'Video') + '</a>'; };
    if (nm) {
      // Los videos "Referencia" son del 1er ejercicio; el/los "Variante/Biserie" son del 2º (y siguientes, en orden).
      var esVar = function(v){ return /variante|biserie/i.test(v.t || ''); };
      var vp = vs.filter(function(v){ return !esVar(v); }), vv = vs.filter(esVar);
      h += '<p class="pl" style="margin:12px 0 0">Variantes (elegí una)</p>';
      nm.forEach(function(n, j){
        var mine = j === 0 ? vp : (vv[j - 1] ? [vv[j - 1]] : []);
        h += '<div class="vr"><b><i>' + String.fromCharCode(65 + j) + '</i>' + esc(n) + '</b><span class="vb">' + mine.map(btn).join('') + '</span></div>';
      });
      vs = vv.slice(nm.length - 1);
    }
    if (vs.length) {
      h += '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">';
      vs.forEach(function(v){ h += btn(v); });
      h += '</div>';
    }
    var ok = day + '_' + ei;
    h += '<label class="pl" for="obs' + ei + '" style="display:block;margin:12px 0 6px">Tus observaciones</label>' +
      '<textarea id="obs' + ei + '" rows="2" style="width:100%;font-size:14px;padding:8px" placeholder="Anotá cómo te fue, qué sentiste o tus dudas" oninput="setobs(' + ei + ',this.value)" onchange="saveObs()">' + esc(O[ok] || '') + '</textarea>';
    h += '</div>';
  });
  $('list').innerHTML = h;
  if (RO) {
    Array.prototype.forEach.call(document.querySelectorAll('#list input, #list textarea'), function(el){ el.readOnly = true; });
    Array.prototype.forEach.call(document.querySelectorAll('#list .ok'), function(el){ el.disabled = true; });
    Array.prototype.forEach.call(document.querySelectorAll('#list textarea'), function(el){ el.placeholder = 'Sin observaciones'; });
  }
  prog();
}

// Selector de las últimas 4 semanas (todas editables).
function renderSemanas(){
  var el = $('wks'); if (!el) return;
  if (SEMS.length < 2) { el.style.display = 'none'; return; }
  el.style.display = '';
  var h = '';
  for (var i = SEMS.length - 1; i >= 0; i--) {   // SEMS viene con la más nueva primero: se muestra al revés (la más vieja a la izquierda, la actual al final)
    var n = SEMS[i], m = /^S(\d+)\s*-\s*(\d+\/\d+)/.exec(n);
    h += '<button class="wk' + (n === SEL ? ' on' : '') + '" onclick="cambiarSemana(' + i + ')">' + (m ? 'Sem ' + m[1] : esc(n)) + '<small>' + (m ? esc(m[2]) : '') + '</small></button>';
  }
  el.innerHTML = h;
}
function cambiarSemana(i){
  var n = SEMS[i];
  if (!n || n === SEL) return;
  touched = true; skip();
  ST[SEL] = { S: S, O: O };
  var my = ++REQ;
  if (W[n]) { init(W[n], true); return; }
  var el = $('list'); if (el) el.innerHTML = '<p class="meta" style="margin-top:14px">Cargando semana…</p>';
  leer(n).then(function(r){ if (my === REQ) init(r, true); })
    .catch(function(){ if (my !== REQ) return; render(); msg('No pude cargar esa semana. Probá de nuevo.', false); });
}

function go(i){ day = i; msg('', true); render(); }
// Reps: solo enteros. Kg y RIR: números con coma o punto decimal.
function soloNum(v, dec){
  v = String(v).replace(dec ? /[^\d.,]/g : /\D/g, '');
  if (dec) { var i = v.search(/[.,]/); if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/[.,]/g, ''); }
  return v.slice(0, 6);
}
function setv(k, f, v){ if (RO) return;
  var el = event && event.target, lim = soloNum(v, f !== 'r');
  if (el && el.value !== lim) el.value = lim;
  v = lim; touched = true; S[k] = S[k] || {}; S[k][f] = v; S[k].d = false;
  // borrador local: sobrevive aunque no se toque ✓
  DR[SEL] = DR[SEL] || {}; DR[SEL][k] = { r: S[k].r, k: S[k].k, i: S[k].i }; lsSet(DK_, DR);
  var b = event && event.target && event.target.parentNode.querySelector('.ok'); if (b) b.classList.remove('done'); msg('', true); }

function tog(ei, s){
  if (RO) return;
  touched = true;
  var d = day, k = key(d, ei, s), v = S[k] || {}, sw = SEL;
  v.r = soloNum(v.r == null ? '' : v.r, false); v.k = soloNum(v.k == null ? '' : v.k, true); v.i = soloNum(v.i == null ? '' : v.i, true);
  if (v.r === '' || v.k === '' || isNaN(parseFloat(v.r.replace(',', '.'))) || isNaN(parseFloat(v.k.replace(',', '.')))) { msg('Cargá reps y kilos antes de marcar la serie.', false); return; }
  v.d = true; S[k] = v;
  if (DR[sw]) { delete DR[sw][k]; lsSet(DK_, DR); }   // ya no es borrador: pasa a la cola de pendientes
  rest(restSec(D[d].ejercicios[ei].descanso));
  encolar('s|' + sw + '|' + d + '|' + ei + '|' + s, { action: 'serie', d: d, e: ei, s: s, reps: v.r, peso: v.k, rir: v.i || '' }, sw);
  msg('', true); render();
}

function saveSleep(v){
  if (RO) return;
  encolar('z|' + SEL + '|' + day, { action: 'sueno', d: day, horas: v }, SEL);
}

// Observaciones por ejercicio: se guardan en el celular en cada tecla y se envían solas al dejar de escribir (o al salir del cuadro).
function setobs(ei, v){
  if (RO) return;
  touched = true;
  var d = day, sw = SEL, k = d + '_' + ei;
  O[k] = v;
  encolar('o|' + sw + '|' + k, { action: 'obs', d: d, e: ei, texto: v }, sw, 1200);
}
function saveObs(){ clearTimeout(DT); vaciar(); }   // al salir del cuadro, se envía ya

function exDone(ei){ var x = D[day].ejercicios[ei]; return x.series.length > 0 && x.series.every(function(s, si){ return (S[key(day,ei,si)] || {}).d; }); }
function counts(){
  var a = 0, b = 0;
  D[day].ejercicios.forEach(function(x, ei){ x.series.forEach(function(s, si){ b++; if ((S[key(day,ei,si)] || {}).d) a++; }); });
  return [a, b];
}
function prog(){
  var c = counts(), p = c[1] ? Math.round(c[0] / c[1] * 100) : 0;
  $('plab').textContent = c[0] + ' de ' + c[1] + ' series completadas';
  $('ppct').textContent = p + '%';
  $('pb').style.width = p + '%';
}
function finish(){
  if (RO) return;
  var c = counts();
  if (!c[0]) { msg('Marcá al menos una serie antes de terminar.', false); return; }
  vaciar();
  var n = Object.keys(OUT).length;
  if (n) msg('Todo quedó guardado en tu celular. Se enviará a la planilla apenas haya conexión.', true);
  else msg('Listo. Cada serie ya quedó guardada en tu planilla.', true);
}

// Descanso: FALTAN (cuenta regresiva) y DESCANSADO (tiempo real). Se calcula con la hora, no con "ticks", así no se atrasa si el celular pausa la pestaña.
var TS = 0, TT = 0, EL = 0;
function rest(sec){ clearInterval(T); TS = Date.now(); TT = sec; T = setInterval(tick, 500); tick(); }
function tick(){
  EL = Math.floor((Date.now() - TS) / 1000); left = TT - EL;
  if (left <= 0) { left = 0; clearInterval(T); T = null; }
  showRest();
}
function ajustar(d){ if (!T) return; TT = Math.max(0, TT + d); tick(); }   // -30 s / +30 s: cambia lo que falta, no lo descansado
function showRest(){
  $('rest').innerHTML = T
    ? '<div class="bl"><b>' + fmt(left) + '</b><small>FALTAN</small></div><div class="sep"></div><div class="bl e"><b>' + fmt(EL) + '</b><small>DESCANSADO</small></div>' +
      '<button onclick="ajustar(-30)" aria-label="Restar 30 segundos">−30 s</button><button onclick="ajustar(30)" aria-label="Sumar 30 segundos">+30 s</button><a href="#" onclick="skip();return false" target="_self">Omitir</a>'
    : '<span>Descanso terminado · ' + fmt(EL) + '</span><button onclick="rest(30)">+30 s</button><a href="#" onclick="skip();return false" target="_self">Cerrar</a>';
}
function skip(){ clearInterval(T); T = null; $('rest').textContent = ''; }
</script>
</body>
</html>
